name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      # wire.go only compiles under the wireinject build tag, so normal
      # builds consume the committed wire_gen.go. Regenerate it with the
      # wire version pinned in go.mod (same command as the //go:generate
      # directive) and fail when the committed file is stale, e.g. after a
      # ProviderSet change without rerunning wire.
      - name: Check generated code is up to date
        run: |
          go run -mod=mod github.com/google/wire/cmd/wire gen ./internal/app
          git diff --exit-code -- internal/app/wire_gen.go

      # Integration tests start a postgres:18 container via testcontainers;
      # GitHub-hosted ubuntu runners ship Docker by default.
      - name: Test
        run: go test ./... -count=1 -timeout 15m

  build:
    name: Build (${{ matrix.target }})
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            goos: linux
            goarch: amd64
          - target: linux-arm64
            goos: linux
            goarch: arm64
          - target: android-arm64
            goos: android
            goarch: arm64
    env:
      CGO_ENABLED: "0"
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # Build commands are inlined here on purpose (no dependency on
      # scripts/build_android.sh / build_android.ps1); same flags:
      # -trimpath -ldflags="-s -w", plus injected build info.
      - name: Compute build info
        id: buildinfo
        run: |
          echo "version=${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'dev' }}" >> "$GITHUB_OUTPUT"
          echo "commit=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build
        run: >-
          go build -trimpath
          -ldflags="-s -w
          -X github.com/dongwlin/legero-backend/internal/infra/config.Version=${{ steps.buildinfo.outputs.version }}
          -X github.com/dongwlin/legero-backend/internal/infra/config.Commit=${{ steps.buildinfo.outputs.commit }}
          -X github.com/dongwlin/legero-backend/internal/infra/config.BuildTime=${{ steps.buildinfo.outputs.build_time }}"
          -o dist/legero-${{ matrix.target }} .

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: legero-${{ matrix.target }}
          path: dist/legero-${{ matrix.target }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [test, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: legero-*
          path: dist
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
